<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mini Computer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desktop">
    <header class="topbar">
      <h1>Void Mini Computer</h1>
      <div class="status">
        <span class="lamp green"></span>
        <span class="label">Online</span>
      </div>
    </header>

    <main class="grid">
      <!-- Browser window -->
      <section class="window">
        <div class="titlebar">
          <span class="title">Browser</span>
          <div class="controls">
            <button class="btn" id="homeBtn" title="Home">🏠</button>
            <button class="btn" id="voidBtn" title="Void Network">🕳️ Void</button>
            <button class="btn" id="reloadBtn" title="Reload">⟳</button>
          </div>
        </div>
        <div class="toolbar">
          <input type="text" id="urlInput" placeholder="Enter URL and press Go…" />
          <button id="goBtn" class="accent">Go</button>
        </div>
        <iframe id="browserFrame" src="https://example.com" title="Mini Browser"></iframe>
      </section>

      <!-- Games launcher -->
      <section class="window">
        <div class="titlebar">
          <span class="title">Games</span>
        </div>
        <div class="games">
          <button class="game-card" id="openFlappy">
            <div class="emoji">🐦</div>
            <div class="name">Flappy Bird</div>
          </button>
          <button class="game-card" id="openSnake">
            <div class="emoji">🐍</div>
            <div class="name">Snake</div>
          </button>
        </div>
      </section>

      <!-- Game window: Flappy Bird -->
      <section class="window" id="flappyWindow" hidden>
        <div class="titlebar">
          <span class="title">Flappy Bird</span>
          <button class="btn" id="closeFlappy">✖</button>
        </div>
        <div class="game-container">
          <canvas id="flappyCanvas" width="420" height="560"></canvas>
          <div class="panel">
            <button class="accent" id="flappyStart">Start / Space</button>
            <button id="flappyReset">Reset</button>
            <div class="score">
              <strong>Score:</strong> <span id="flappyScore">0</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Game window: Snake -->
      <section class="window" id="snakeWindow" hidden>
        <div class="titlebar">
          <span class="title">Snake</span>
          <button class="btn" id="closeSnake">✖</button>
        </div>
        <div class="game-container">
          <canvas id="snakeCanvas" width="420" height="420"></canvas>
          <div class="panel">
            <button class="accent" id="snakeStart">Start</button>
            <button id="snakeReset">Reset</button>
            <div class="score">
              <strong>Score:</strong> <span id="snakeScore">0</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="dock">
      <button class="dock-app" id="dockBrowser">🌐 Browser</button>
      <button class="dock-app" id="dockFlappy">🐦 Flappy</button>
      <button class="dock-app" id="dockSnake">🐍 Snake</button>
    </footer>
  </div>

  <script>
    // Browser controls
    const frame = document.getElementById('browserFrame');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const homeBtn = document.getElementById('homeBtn');
    const voidBtn = document.getElementById('voidBtn');
    const reloadBtn = document.getElementById('reloadBtn');

    function navigate(url) {
      // Prepend https if missing
      const full = url.match(/^https?:\/\//i) ? url : 'https://' + url;
      frame.src = full;
    }

    goBtn.addEventListener('click', () => navigate(urlInput.value.trim()));
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate(urlInput.value.trim());
    });
    homeBtn.addEventListener('click', () => {
      navigate('example.com');
      urlInput.value = 'example.com';
    });
    voidBtn.addEventListener('click', () => {
      const voidLink = 'https://anyhting.bg.geek.nz/p.html';
      navigate(voidLink);
      urlInput.value = voidLink;
    });
    reloadBtn.addEventListener('click', () => frame.contentWindow?.location?.reload());

    // Window management
    const flappyWindow = document.getElementById('flappyWindow');
    const snakeWindow = document.getElementById('snakeWindow');
    const openFlappy = document.getElementById('openFlappy');
    const openSnake = document.getElementById('openSnake');
    const closeFlappy = document.getElementById('closeFlappy');
    const closeSnake = document.getElementById('closeSnake');

    const dockBrowser = document.getElementById('dockBrowser');
    const dockFlappy = document.getElementById('dockFlappy');
    const dockSnake = document.getElementById('dockSnake');

    function show(el) { el.hidden = false; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    function hide(el) { el.hidden = true; }

    openFlappy.addEventListener('click', () => show(flappyWindow));
    openSnake.addEventListener('click', () => show(snakeWindow));
    closeFlappy.addEventListener('click', () => hide(flappyWindow));
    closeSnake.addEventListener('click', () => hide(snakeWindow));

    dockBrowser.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    dockFlappy.addEventListener('click', () => show(flappyWindow));
    dockSnake.addEventListener('click', () => show(snakeWindow));
  </script>

  <script src="js/flappybird.js"></script>
  <script src="js/snake.js"></script>
</body>
</html>
